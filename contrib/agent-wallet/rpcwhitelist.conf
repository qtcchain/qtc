# qtcd configuration fragment for the Agent Wallet Service RPC user (spec §9).
# Generate the rpcauth line with share/rpcauth/rpcauth.py aws  and paste it below;
# the AWS then connects with rpc_user/rpc_password instead of the cookie.
#
# rpcauth=aws:<salt>$<hmac>
# Only the aws user is restricted; the operator keeps cookie access for funding, mining and maintenance.
rpcwhitelistdefault=0
rpcwhitelist=aws:createwallet,loadwallet,unloadwallet,listwallets,listwalletdir,encryptwallet,walletpassphrase,walletlock,getnewaddress,getrawchangeaddress,getbalances,listunspent,listtransactions,gettransaction,walletcreatefundedpsbt,walletprocesspsbt,combinepsbt,finalizepsbt,decodepsbt,analyzepsbt,decoderawtransaction,testmempoolaccept,sendrawtransaction,estimatesmartfee,getmempoolinfo,getblockchaininfo,getblockcount,getnetworkinfo,getdifficultyhealth,getrawtransaction,gettxout,getdescriptorinfo,deriveaddresses,importdescriptors,createwalletdescriptor,lockunspent,validateaddress,exportpqkey,z_verifywalletintegrity,backupwalletbundlearchive,backupwallet
